compileOption:
  instSelMethod:
  - insttype:
      include:
      - all
      # SDC > 50&
      # - add
      # - sub
      # - trunc
      # - store
      # - zext
      # - invoke
      # - lshr
      # - select
      exclude:
      - getelementptr
      - phi

  regSelMethod: regloc
  regloc: allreg

  tracingPropagation: False # trace dynamic instruction values.

  tracingPropagationOption:
    maxTrace: 250 # max number of instructions to trace during fault injection run
    debugTrace: False
    generateCDFG: True

runOption:
- run:
    numOfRuns: 5
    fi_type: bitflip
    verbose: true
    fi_cycle: 1657472
    fi_max_multiple: 1
    # fi_bit: all
    # fi_num_bits: 1
    # fi_index: 10
    # window_len_multiple: 2


defaultTimeout: .39051800
